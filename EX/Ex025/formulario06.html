<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>

        body{
            width: 95vw;
            font-family: Arial, Helvetica, sans-serif;
        }
        fieldset{
            margin: 20px 0;
            border-radius: 0.7em;
        }
        h1{
            text-align: center;
        }
        div{
            width: 500px;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <div>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="icor">Cor : </label>
            <input type="color" name="cor" id="icor" value="#0000ff">
        </p>
        <p>
            <label for="inivel">Nível de Satisfação: </label>
            <input type="range" name="nivel" id="inivel" min="0" max="10" value="7">
        </p>
        <p>
            <label for="ifoto">Foto de perfil: </label>
            <input type="file" name="foto" id="ifoto">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
    <h5>
    <p>Página ✅</p>
        <blockquote>
            <a href="formulario07.html">Próxima ✅</a>
            <a href="formulario05.html">Voltar ✅</a>
        </blockquote>
    </h5>
    </div>

</body>
</html>
