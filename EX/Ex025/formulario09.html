<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplos de Formulários.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inum">Número :</label>
            <input type="range" name="num" id="inum" min="0" max="10" value="3" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">3</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
    <h5>
    <p>Página ✅</p>
        <blockquote>
            <a href="formulario10.html">Próxima ✅</a>
            <a href="formulario08.html">Voltar ✅</a>
        </blockquote>
    </h5>
</body>
</html>
