<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>

        body{
            width: 95vw;
            font-family: Arial, Helvetica, sans-serif;
        }
        fieldset{
            margin: 20px 0;
            border-radius: 0.7em;
        }
        h1{
            text-align: center;
        }
        div{
            width: 500px;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <div>
        <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo ?</legend>
            <input type="radio" name="sexo" id="isxmas" value="M">
            <label for="isxmas">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfm" checked value="F">
            <label for="isxfm">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos ?</legend>
            <input type="checkbox" name="esbas" id="iesbas">
            <label for="iesbas">Basquete</label>
            <input type="checkbox" name="esfut" id="iesfut" checked>
            <label for="iesfut">Futebol</label>
            <input type="checkbox" name="esnat" id="iesnat">
            <label for="iesnat">Natação</label>
            <input type="checkbox" name="esten" id="iesten">
            <label for="iesten">Tênis</label>
        </fieldset>







        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
    <h5>
    <p>Página ✅</p>
        <blockquote>
            <a href="formulario06.html">Próxima ✅</a>
            <a href="formulario04.html">Voltar ✅</a>
        </blockquote>
    </h5>
    </div>
</body>
</html>
