<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplos de Formulários.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="iest">Estado: </label>
            <select name="estado" id="iest">

                <option value="" selected>--Escolha--</option>
                <optgroup label="Região Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>

                <optgroup label=" Região Sul">
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="PR">Parána</option>
                        <option value="SC">Santa Catarina</option>
                </optgroup>

                <optgroup label=" Região Nordeste">
                        <option value="BH">Bahia</option>
                </optgroup>

                <optgroup label=" Região Centro-Oeste">
                        <option value="DF">Distrito Federal</option>
                        <option value="GO">Goiás</option>
                </optgroup>

                <optgroup label=" Região Norte">
                        <option value="PA">Pará</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Professor: </label>
            <input type="text" name="professor" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <option value="ADM">Adiminstrador</option>
                <option value="CONT">Contador</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">Mesangem: </label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
    <h5>
    <p>Página ✅</p>
        <blockquote>
            <a href="formulario08.html">Próxima ✅</a>
            <a href="formulario06.html">Voltar ✅</a>
        </blockquote>
    </h5>
</body>
</html>
