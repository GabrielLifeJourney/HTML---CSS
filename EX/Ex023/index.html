<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/main.css">
    <title>Tabela</title>
</head>
<body>
    <h1>Minha Primeira Tabela !.</h1>
    <!--
        Hierarquia de Tabelas
        table = tabela
            table row = linha de tabela
                table header = linha de cabeçalho
                table data = dado de tabela

    Respeitar a Hierarquia
    -->
        <table>
            <tr class="linha"> <!--PRIMEIRA LINHA-->
                <td>A1</td>
                <td class="dado">B1</td>
                <td>C1</td>
                <td class="dado">D1</td>
            </tr>
            <tr> <!--Segunda LINHA-->
                <td>A2</td> 
                <td class="dado">B2</td>
                <td>C2</td>
                <td class="dado">D2</td>
            </tr>
            <tr> <!--Terceira LINHA-->
                <td>A3</td>
                <td class="dado">B3</td>
                <td>C3</td>
                <td class="dado">D3</td>
            </tr>
            <tr> <!--Quarta LINHA-->
                <td>A4</td>
                <td class="dado">B4</td>
                <td>C4</td>
                <td class="dado">D4</td>
            </tr>
            
        </table>
</body>
</html>
