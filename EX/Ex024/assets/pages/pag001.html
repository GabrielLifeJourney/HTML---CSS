<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pag01</title>
    <style>
        table{
            width: 600px;
            margin: auto;
            border-collapse: collapse;
            text-align: center; 
            vertical-align: middle;
        }
        caption,td, th{
            border: 1px solid black;
        }
        caption{
            font-size: 1.5em;
            padding: 1vw;
            font-weight: bolder;
            background-color: white;
        }
        thead tr{
            background-color: black;
            color: lime;
        }
        thead th{
            border-left: 1px solid white;
            border-right: 1px solid white;
        }
        td{
            padding: 0.6em 1em;
        }
        .cnome , .cidade {
            background-color: lime;
        }
        .csexo{
            background-color: yellow;
        }
        .cprof{
            background-color: white;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: blue;
        }
        blockquote {
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </thead>
        <tbody>
            <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
            </tr>
            <tr>
                <td>Cláudio</td>
                <td>M</td>
                <td>28</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>M</td>
                <td>42</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Hélio</td>
                <td>M</td>
                <td>19</td>
                <td>Vendedor</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>F</td>
                <td>39</td>
                <td>Médica</td>
            </tr>
            <tr>
                <td>Otávio</td>
                <td>M</td>
                <td>22</td>
                <td>Nutricionista</td>
            </tr>

        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
